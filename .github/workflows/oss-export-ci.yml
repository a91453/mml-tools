name: OSS Export CI

on:
  push:
    branches: ['oss/**']
  pull_request:
    paths:
      - 'oss/**'
      - 'scripts/export-oss.mjs'
      - 'scripts/audit-oss-export.mjs'
      - '.github/workflows/oss-export-ci.yml'
      - 'studio/**'
      - 'server/**'
      - 'dist/core.js'
      - 'dist/player.js'
      - 'tests/core.test.mjs'
      - 'tests/mcp.test.mjs'
      - 'tests/player.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate clean public tree
        run: node scripts/export-oss.mjs .oss-export
      - name: Audit export before dependency install
        run: node scripts/audit-oss-export.mjs .oss-export
      - name: Install public dependencies
        working-directory: .oss-export
        run: npm install --ignore-scripts --package-lock=false
      - name: Re-audit tracked export inputs
        working-directory: .oss-export
        run: npm run audit:public
      - name: Run public regression suite
        working-directory: .oss-export
        run: npm test
      - name: Build public Studio PWA
        working-directory: .oss-export
        run: npm run build
      - name: Upload reviewed export tree
        uses: actions/upload-artifact@v4
        with:
          name: mml-tools-oss-export
          path: .oss-export/
          include-hidden-files: true

  export-audio-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/export-oss.mjs .oss-export
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .oss-export/studio/audio-worker/requirements.txt
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: python -m pip install -r .oss-export/studio/audio-worker/requirements.txt
      - working-directory: .oss-export/studio/audio-worker
        run: python -m unittest discover -s tests -v

  export-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/export-oss.mjs .oss-export
      - working-directory: .oss-export
        run: npm install --ignore-scripts --package-lock=false
      - working-directory: .oss-export
        run: npx playwright install --with-deps chromium webkit
      - working-directory: .oss-export
        run: npm run build
      - working-directory: .oss-export
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oss-browser-results
          path: .oss-export/studio/browser-results/
