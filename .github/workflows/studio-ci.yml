name: Studio CI

on:
  push:
    branches: [studio-v1, studio-web-v1, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manifest validation reads the immutable rules snapshot and Git provenance.
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify published Canonical Bootstrap
        run: npm run canonical:bootstrap -- --summary
      - name: Run legacy and Studio symbolic regressions
        run: npm test
      - name: Verify Canonical bootstrap isolation under the full suite (M6)
        # Re-runs the suite under the Git subprocess probe and fails if any test
        # process wrote the shared discovery ref or HEAD, if more than one
        # published or snapshot identity was resolved from this checkout, or if
        # any bootstrap was refused.
        run: node scripts/bootstrap-stress.mjs --runs=1
      - name: Build local Studio PWA
        run: npm run build:studio-web
      - name: Build legacy production bundle
        run: npm run build

  audio-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/audio-worker/requirements.txt
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Install pinned audio dependencies
        run: python -m pip install -r studio/audio-worker/requirements.txt
      - name: Run audio alignment regressions
        working-directory: studio/audio-worker
        run: python -m unittest discover -s tests -v

  studio-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:studio-web
      - run: npm run test:studio-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-web-browser-results
          path: studio/browser-results/
      - uses: actions/upload-artifact@v4
        with:
          name: studio-web-v1-static-build
          path: studio/web-build/
