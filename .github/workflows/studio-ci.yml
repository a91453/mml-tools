name: Studio CI

on:
  push:
    branches: [studio-v1, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manifest validation reads the immutable rules snapshot and Git provenance.
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify published Canonical Bootstrap
        run: npm run canonical:bootstrap -- --summary
      - name: Run legacy and Studio symbolic regressions
        run: npm test
      - name: Build legacy production bundle
        run: npm run build

  audio-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/audio-worker/requirements.txt
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Install pinned audio dependencies
        run: python -m pip install -r studio/audio-worker/requirements.txt
      - name: Run audio alignment regressions
        working-directory: studio/audio-worker
        run: python -m unittest discover -s tests -v
