name: Studio CI

on:
  push:
    branches: [studio-v1, studio-web-v1, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.paths.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce Railway Agent prohibition
        run: node --test tests/railway-agent-policy.test.mjs
      - name: Classify Railway-only changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
          fi
          if [ -z "$base" ] || [ -z "$head" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          if [ -z "$changed" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_heavy=false
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|CLAUDE.md|.claude/settings.json|docs/RAILWAY_AGENT_POLICY.md|tests/railway-agent-policy.test.mjs|scripts/railway-production-audit.mjs|scripts/railway-production-config-apply.mjs|scripts/railway-deployment-diagnostics.mjs|tests/railway-production-audit.test.mjs|tests/railway-production-config-apply.test.mjs|tests/railway-deployment-diagnostics.test.mjs|.github/workflows/railway-production-audit.yml|.github/workflows/railway-production-config-apply.yml|.github/workflows/railway-deployment-diagnostics.yml|.github/workflows/railway-ops-ci.yml|railway/service-settings.json|railway/deployment-target.json|docs/RAILWAY_AGENT_MIGRATION_AUDIT_2026-09-21.md)
                ;;
              *)
                run_heavy=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"
  symbolic:
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manifest validation reads the immutable rules snapshot and Git provenance.
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify published Canonical Bootstrap
        run: npm run canonical:bootstrap -- --summary
      - name: Run legacy and Studio symbolic regressions
        run: npm test
      - name: Verify Canonical bootstrap isolation under the full suite (M6)
        # Re-runs the suite under the Git subprocess probe and fails if any test
        # process wrote the shared discovery ref or HEAD, if more than one
        # published or snapshot identity was resolved from this checkout, or if
        # any bootstrap was refused.
        run: node scripts/bootstrap-stress.mjs --runs=1
      - name: Build local Studio PWA
        run: npm run build:studio-web
      - name: Build legacy production bundle
        run: npm run build

  audio-worker:
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/audio-worker/requirements.txt
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Install pinned audio dependencies
        run: python -m pip install -r studio/audio-worker/requirements.txt
      - name: Run audio alignment regressions
        working-directory: studio/audio-worker
        run: python -m unittest discover -s tests -v

  studio-web:
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:studio-web
      - run: npm run test:studio-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-web-browser-results
          path: studio/browser-results/
      - uses: actions/upload-artifact@v4
        with:
          name: studio-web-v1-static-build
          path: studio/web-build/
