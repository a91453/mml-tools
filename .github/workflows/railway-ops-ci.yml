name: Railway ops CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/railway-*.mjs'
      - 'tests/railway-*.test.mjs'
      - '.github/workflows/railway-*.yml'
      - 'railway/service-settings.json'
      - 'railway/deployment-target.json'
      - 'docs/RAILWAY_AGENT_MIGRATION_AUDIT_2026-09-21.md'
  pull_request:
    paths:
      - 'scripts/railway-*.mjs'
      - 'tests/railway-*.test.mjs'
      - '.github/workflows/railway-*.yml'
      - 'railway/service-settings.json'
      - 'railway/deployment-target.json'
      - 'docs/RAILWAY_AGENT_MIGRATION_AUDIT_2026-09-21.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Railway ops regressions
        run: node --test tests/railway-*.test.mjs
      - name: Validate Railway JSON references
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('railway/service-settings.json','utf8')); JSON.parse(require('node:fs').readFileSync('railway/deployment-target.json','utf8'))"
