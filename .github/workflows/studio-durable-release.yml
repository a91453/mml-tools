name: Studio durable release

on:
  push:
    branches: [studio-permanent-durable-migration]
    paths:
      - .github/workflows/studio-durable-release.yml
      - ops/permanent/package_release.py
      - ops/permanent/publish-release.mjs
      - ops/permanent/release-lock.json
  workflow_dispatch:

concurrency:
  group: studio-durable-release-45c5a2963b1e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published main and build the pinned merged source
        shell: bash
        run: |
          test "$(git rev-parse origin/main)" = 45c5a2963b1e2e55fb6d28cf21aeb6af2f6e7614
          git worktree add --detach /tmp/studio-release-source 45c5a2963b1e2e55fb6d28cf21aeb6af2f6e7614
          cd /tmp/studio-release-source
          npm install --ignore-scripts --package-lock=false
          node scripts/bootstrap-canonical.mjs --summary
          node scripts/build.mjs
          node scripts/build-studio-web.mjs
          node scripts/verify-studio-artifact.mjs studio/web-build --buildId=dd273beedc0ce16485bd837cf6074171d63eda262fe0b4599f312961ca3b9e97 --sourceSha=45c5a2963b1e2e55fb6d28cf21aeb6af2f6e7614 --canonical_version=2026-09-23-v2 --canonical_status=PUBLISHED --manifest_version=2026-09-23-v2-manifest1 --rules_snapshot_sha=1c84c95133990e3882a5770077c3d2d39b1a6b04 --machine_delivery_schema=mabinogi-mobile-mml-studio/machine-delivery@1
      - name: Package deterministic runtime and separately pinned trust bundles
        run: |
          python ops/permanent/package_release.py /tmp/studio-release-source /tmp/studio-release-source/studio/web-build /tmp/studio-release-assets
          cmp ops/permanent/release-lock.json /tmp/studio-release-assets/release-lock.json
      - name: Publish durable release assets without replacing historical assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ops/permanent/publish-release.mjs /tmp/studio-release-assets
