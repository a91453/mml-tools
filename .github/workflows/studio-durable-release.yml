name: Studio durable release

on:
  push:
    branches: [studio-permanent-durable-migration]
    paths:
      - .github/workflows/studio-durable-release.yml
      - ops/permanent/package_release.py
      - ops/permanent/publish-release.mjs
      - ops/permanent/release-lock.json
  workflow_dispatch:

concurrency:
  group: studio-durable-release-d7ec3c6ea7bd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published main and build the pinned merged source
        shell: bash
        run: |
          test "$(git rev-parse origin/main)" = d7ec3c6ea7bd9e69488389e0e9db71a38fbb3e7a
          git worktree add --detach /tmp/studio-release-source d7ec3c6ea7bd9e69488389e0e9db71a38fbb3e7a
          cd /tmp/studio-release-source
          npm install --ignore-scripts --package-lock=false
          node scripts/bootstrap-canonical.mjs --summary
          node scripts/build.mjs
          node scripts/build-studio-web.mjs
          node scripts/verify-studio-artifact.mjs studio/web-build --buildId=f7c5c9d5fa625063123bfae44a5259ed04b36515bf14cc41fe4fda79255872c9 --sourceSha=d7ec3c6ea7bd9e69488389e0e9db71a38fbb3e7a --canonical_version=2026-09-23-v3 --canonical_status=PUBLISHED --manifest_version=2026-09-23-v3-manifest1 --rules_snapshot_sha=ff1a9df054f5ca1ae42571067fc95feb274755ef --machine_delivery_schema=mabinogi-mobile-mml-studio/machine-delivery@2
      - name: Package deterministic runtime and separately pinned trust bundles
        run: |
          python ops/permanent/package_release.py /tmp/studio-release-source /tmp/studio-release-source/studio/web-build /tmp/studio-release-assets
          cmp ops/permanent/release-lock.json /tmp/studio-release-assets/release-lock.json
      - name: Publish durable release assets without replacing historical assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ops/permanent/publish-release.mjs /tmp/studio-release-assets
