name: Studio durable release

on:
  push:
    branches: [studio-permanent-durable-migration]
    paths:
      - .github/workflows/studio-durable-release.yml
      - ops/permanent/package_release.py
      - ops/permanent/publish-release.mjs
      - ops/permanent/release-lock.json
  workflow_dispatch:

concurrency:
  group: studio-durable-release-5769e76849e5
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published main and build the pinned merged source
        shell: bash
        run: |
          test "$(git rev-parse origin/main)" = 5769e76849e5ef8dad03b4080050cafcf1c2eabe
          git worktree add --detach /tmp/studio-release-source 5769e76849e5ef8dad03b4080050cafcf1c2eabe
          cd /tmp/studio-release-source
          npm install --ignore-scripts --package-lock=false
          node scripts/bootstrap-canonical.mjs --summary
          node scripts/build.mjs
          node scripts/build-studio-web.mjs
          node scripts/verify-studio-artifact.mjs studio/web-build --buildId=34c67a4a1284eee1243ee51858096660c16cbf22cf0347e139abb15f2dc3e258 --sourceSha=5769e76849e5ef8dad03b4080050cafcf1c2eabe --canonical_version=2026-09-13-v1 --canonical_status=PUBLISHED --manifest_version=2026-09-13-v1-manifest1 --rules_snapshot_sha=0a172900a01fdf39c2e9e84cf176961320b779ea
      - name: Package deterministic runtime and separately pinned trust bundles
        run: |
          python ops/permanent/package_release.py /tmp/studio-release-source /tmp/studio-release-source/studio/web-build /tmp/studio-release-assets
          cmp ops/permanent/release-lock.json /tmp/studio-release-assets/release-lock.json
      - name: Publish durable release assets without replacing historical assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ops/permanent/publish-release.mjs /tmp/studio-release-assets
