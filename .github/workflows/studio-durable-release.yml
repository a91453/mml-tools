name: Studio durable release

on:
  workflow_dispatch:

concurrency:
  group: studio-durable-release-a42928a0b386
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published main and build the pinned merged source
        shell: bash
        run: |
          test "$(git rev-parse origin/main)" = a42928a0b386ee1d4122ac7273b12f307e0e3bc0
          git worktree add --detach /tmp/studio-release-source a42928a0b386ee1d4122ac7273b12f307e0e3bc0
          cd /tmp/studio-release-source
          # The pinned commit carries package-lock.json, so the release installs
          # exactly that tree; npm ci resolves nothing (roadmap G13).
          npm ci --ignore-scripts
          node scripts/bootstrap-canonical.mjs --summary
          node scripts/build.mjs
          node scripts/build-studio-web.mjs
          node scripts/verify-studio-artifact.mjs studio/web-build --buildId=1248f6168819fd570fc145ba22259490086cea9bd5969c07eff33e647a746000 --sourceSha=a42928a0b386ee1d4122ac7273b12f307e0e3bc0 --canonical_version=2026-09-23-v3 --canonical_status=PUBLISHED --manifest_version=2026-09-23-v3-manifest1 --rules_snapshot_sha=ff1a9df054f5ca1ae42571067fc95feb274755ef --machine_delivery_schema=mabinogi-mobile-mml-studio/machine-delivery@2
      - name: Package deterministic runtime and separately pinned trust bundles
        run: |
          python ops/permanent/package_release.py /tmp/studio-release-source /tmp/studio-release-source/studio/web-build /tmp/studio-release-assets
          cmp ops/permanent/release-lock.json /tmp/studio-release-assets/release-lock.json
      - name: Publish durable release assets without replacing historical assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ops/permanent/publish-release.mjs /tmp/studio-release-assets
