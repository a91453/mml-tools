name: Studio service CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.paths.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify Railway-only changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
          fi
          if [ -z "$base" ] || [ -z "$head" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          if [ -z "$changed" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_heavy=false
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|CLAUDE.md|.claude/settings.json|.codex/rules/railway-agent.rules|.github/copilot-instructions.md|docs/RAILWAY_AGENT_POLICY.md|tests/railway-agent-policy.test.mjs|scripts/railway-production-audit.mjs|scripts/railway-production-config-apply.mjs|scripts/railway-deployment-diagnostics.mjs|tests/railway-production-audit.test.mjs|tests/railway-production-config-apply.test.mjs|tests/railway-deployment-diagnostics.test.mjs|.github/workflows/railway-production-audit.yml|.github/workflows/railway-production-config-apply.yml|.github/workflows/railway-deployment-diagnostics.yml|.github/workflows/railway-ops-ci.yml|railway/service-settings.json|railway/deployment-target.json|docs/RAILWAY_AGENT_MIGRATION_AUDIT_2026-09-21.md)
                ;;
              *)
                run_heavy=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"
  service-browser:
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:studio-web
      - name: Test shared browser and MCP workspace on all three profiles
        run: node studio/browser-tests/service-workspace.mjs --agent --out "$RUNNER_TEMP/service-browser"
      # Never upload the whole output directory: it contains a disposable TLS
      # private key and test stores. Only explicit evidence files may leave CI.
      - name: Upload service-browser evidence
        id: upload_service_browser_evidence
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: studio-service-browser-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/service-browser/*.png
            ${{ runner.temp }}/service-browser/verification.json
      - name: Warn if service-browser evidence upload failed
        if: ${{ always() && steps.upload_service_browser_evidence.outcome == 'failure' }}
        run: echo "::warning::Service-browser validation ran, but optional evidence upload failed; validation result remains authoritative."

  container-smoke:
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_IMAGE: mml-studio-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive the exact tested checkout without Git metadata
        run: |
          mkdir -p "$RUNNER_TEMP/studio-image-context"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/studio-image-context"
          test ! -e "$RUNNER_TEMP/studio-image-context/.git"
      - name: Build the real Railway image from a source snapshot
        env:
          DOCKER_BUILDKIT: '1'
          # Short-lived read-only job token. Existing Dockerfile confines ARG
          # to its first stage. No images or build caches are pushed/exported.
          MML_CANONICAL_SOURCE_TOKEN: ${{ github.token }}
        run: |
          docker build --file "$RUNNER_TEMP/studio-image-context/railway/Dockerfile" \
            --build-arg MML_CANONICAL_SOURCE_TOKEN \
            --build-arg RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" \
            --tag "$SMOKE_IMAGE" "$RUNNER_TEMP/studio-image-context"
      - name: Start image and verify runtime, Canonical, OAuth and exact workspace assets
        env:
          # Actual PR source identity is separate from GITHUB_SHA (merge test).
          MML_CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/studio-container-smoke.mjs --image "$SMOKE_IMAGE" --out "$RUNNER_TEMP/container-smoke.json"
      - name: Upload container-smoke evidence
        id: upload_container_smoke_evidence
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: studio-container-smoke-evidence
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/container-smoke.json
      - name: Warn if container-smoke evidence upload failed
        if: ${{ always() && steps.upload_container_smoke_evidence.outcome == 'failure' }}
        run: echo "::warning::Container smoke validation ran, but optional evidence upload failed; validation result remains authoritative."
      - name: Remove local image and credential-bearing intermediate build cache
        if: always()
        run: |
          docker image rm --force "$SMOKE_IMAGE" || true
          docker builder prune --all --force
