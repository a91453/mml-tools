name: PR46 isolated audit dependencies

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/pr46-history-audit.yml'

permissions:
  contents: read

jobs:
  inputs:
    if: github.event.pull_request.number == 46 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact repository dependencies without lifecycle scripts
        run: npm install --ignore-scripts --package-lock=false
      - name: Package offline audit inputs without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr46-dependencies"
          tar -czf "$RUNNER_TEMP/pr46-dependencies/node-deps.tar.gz" node_modules
          cp package.json "$RUNNER_TEMP/pr46-dependencies/package.json"
          git branch audit-pr46 HEAD
          git branch audit-published-main refs/remotes/origin/main
          git bundle create "$RUNNER_TEMP/pr46-dependencies/repository.bundle" audit-pr46 audit-published-main
          git bundle verify "$RUNNER_TEMP/pr46-dependencies/repository.bundle"
          git rev-parse HEAD refs/remotes/origin/main > "$RUNNER_TEMP/pr46-dependencies/identities.txt"
          sha256sum "$RUNNER_TEMP/pr46-dependencies/node-deps.tar.gz" > "$RUNNER_TEMP/pr46-dependencies/dependencies.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pr46-private-audit-dependencies
          path: ${{ runner.temp }}/pr46-dependencies/
          retention-days: 1
          if-no-files-found: error
