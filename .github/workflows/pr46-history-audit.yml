name: PR46 history audit inputs

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pr46-history-audit.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  inputs:
    if: github.event.pull_request.number == 46 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package authentic history and read-only review metadata
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr46-audit/prs"
          git branch audit-pr46 "$AUDIT_HEAD"
          git branch audit-published-main refs/remotes/origin/main
          git bundle create "$RUNNER_TEMP/pr46-audit/repository.bundle" audit-pr46 audit-published-main
          git bundle verify "$RUNNER_TEMP/pr46-audit/repository.bundle"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr46-audit'
          gaps = []
          def api(path):
              p = subprocess.run(['gh', 'api', path], text=True, capture_output=True)
              if p.returncode:
                  raise RuntimeError(f'GitHub read failed: {path}: {p.stderr.strip()}')
              return json.loads(p.stdout)
          def pages(path):
              result = []
              for page in range(1, 101):
                  batch = api(f'{path}?per_page=100&page={page}')
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise RuntimeError('pagination limit reached')
          repo = os.environ['GITHUB_REPOSITORY']
          for number in range(1, 47):
              prefix = f'repos/{repo}'
              record = {'number': number, 'read_errors': {}}
              for key, path in {
                  'pr': f'{prefix}/pulls/{number}',
                  'files': f'{prefix}/pulls/{number}/files',
                  'reviews': f'{prefix}/pulls/{number}/reviews',
                  'review_comments': f'{prefix}/pulls/{number}/comments',
                  'comments': f'{prefix}/issues/{number}/comments',
              }.items():
                  try:
                      record[key] = api(path) if key == 'pr' else pages(path)
                  except RuntimeError as exc:
                      record['read_errors'][key] = str(exc)
                      gaps.append({'number': number, 'field': key})
              (out / 'prs' / f'{number:02}.json').write_text(json.dumps(record, indent=2) + '\n')
          (out / 'identity.json').write_text(json.dumps({
              'repository': repo,
              'pr_head': os.environ['AUDIT_HEAD'],
              'published_main': subprocess.check_output(['git', 'rev-parse', 'audit-published-main'], text=True).strip(),
              'read_gaps': gaps,
              'scope': 'PRs 1-46 metadata, changed-file patches, reviews and comments; read gaps are NOT a clean audit. Git bundle contains tracked history only, not checkout config or credentials',
          }, indent=2) + '\n')
          print(f'Collected 46 records with {len(gaps)} read gaps to resolve separately.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr46-private-audit-inputs
          path: ${{ runner.temp }}/pr46-audit/
          retention-days: 1
          if-no-files-found: error
