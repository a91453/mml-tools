<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122a32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="在 iPhone 與 iPad 本地整理、比對與審核 Mabinogi Mobile 六軌 MML。" data-i18n-attr="content:page.description">
  <!-- 'wasm-unsafe-eval' lets the vendored SpessaSynth timbre-preview engine compile its bundled WebAssembly (Ogg Vorbis decoder). It permits WebAssembly compilation only, never JavaScript eval; scripts still load only from 'self'. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>MML Studio</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./studio/web/boot.js"></script>
</head>
<body>
  <a href="#main" class="skip" data-i18n="side.skip">跳至專案</a>
  <header class="topbar"><a class="brand" href="#main"><img src="./icon.svg" alt="" width="36" height="36"><span>MML <strong>Studio</strong><small>MABINOGI MOBILE</small></span></a><span class="local-pill" id="network" data-i18n="side.workspace">本地工作空間</span></header>
  <div class="layout">
    <aside><p class="eyebrow">YOUR WORKSPACE</p><label for="projects" data-i18n="side.projects">專案</label><select id="projects" aria-label="開啟專案" data-i18n-attr="aria-label:side.openProject"></select><button id="new-project" class="secondary" data-i18n="side.newProject">＋ 新增專案</button><button id="open-listening" class="secondary" data-i18n="side.listening">試聽工作階段</button><a class="file-button quiet" href="./studio/web/service/index.html" data-i18n="side.service">服務專案 · AI / MCP</a><a class="file-button quiet" id="open-workshop" href="./studio/web/workshop/index.html" data-i18n="side.workshop">工作坊 · MML 編輯器</a><nav aria-label="工作流程" data-i18n-attr="aria-label:nav.label"><a href="#intake">01　<span data-i18n="nav.intake">來源</span></a><a href="#raw-midi">02　Raw MIDI</a><a href="#gates">03　<span data-i18n="nav.gates">分析 Gate</span></a><a href="#review">04　<span data-i18n="nav.review">比對與審核</span></a><a href="#audio">05　<span data-i18n="nav.audio">音訊證據</span></a><a href="#final-delivery">06　Final MML</a><a href="#delivery">07　<span data-i18n="nav.delivery">實機接受</span></a></nav><p class="aside-note" data-i18n="side.localNote">MusicXML、MML 與審核在此裝置執行。</p><p class="save-state" id="save-state" role="status"></p><p class="aside-note" id="storage-detail"></p><button id="export-project" class="quiet" data-i18n="side.exportProject">匯出專案備份</button><button id="export-all" class="quiet" data-i18n="side.exportAll">匯出全部專案（ZIP）</button><label class="file-button quiet"><span data-i18n="side.restore">匯入專案備份</span><input id="restore-project" type="file" accept=".json,.zip,application/json,application/zip"></label><button id="persist-storage" class="quiet" data-i18n="side.persist">保留離線資料</button><button id="apply-update" class="secondary" hidden data-i18n="side.applyUpdate">套用新版（重新載入）</button><div class="prefs"><label for="lang" data-i18n="side.language">語言 (Language)</label><select id="lang"></select><label for="theme" data-i18n="side.theme">主題</label><select id="theme"><option value="system" data-i18n="side.themeSystem">跟隨系統</option><option value="light" data-i18n="side.themeLight">淺色</option><option value="dark" data-i18n="side.themeDark">深色</option></select></div><details class="install"><summary data-i18n="side.install">加入主畫面</summary><p data-i18n="side.installNote">在 Safari 開啟，點「分享」→「加入主畫面」。首次載入完成後可離線開啟；檔案保存在本機，請定期匯出備份。</p></details></aside>
    <main id="main"><section id="listening" class="listening" aria-labelledby="listening-title" hidden></section><div id="workshop-return" hidden></div><div id="boot" role="status" data-i18n="boot.checking">正在核對 Published Canonical…</div><div id="app" hidden></div></main>
  </div>
  <div id="message" role="status" aria-live="polite"></div>
  <script type="module" src="./studio/web/app.mjs"></script>
</body>
</html>
